<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — DocuFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F8FAFC;
    }
    .login-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 12px;
    }
    .demo-roles {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .demo-role-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      margin-bottom: 6px;
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .demo-role-btn:hover {
      background: #EEF2FF;
      border-color: var(--primary-accent);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">DF</div>
      <h1 style="font-size: 20px; font-weight: 700; color: var(--text-main);">Welcome to DocuFlow</h1>
      <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">Intelligent Document Processing & Automation</p>
    </div>

    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-control" type="email" id="email" required placeholder="admin@docuflow.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <div id="loginError" style="display:none; color: var(--error); font-size: 12.5px; margin-bottom: 14px;"></div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 10px;">
        Sign In
      </button>
    </form>

    <div class="demo-roles">
      <div style="font-size: 11.5px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.04em;">
        Quick Test Accounts (Click to Fill)
      </div>
      <button class="demo-role-btn" onclick="fillCreds('admin@docuflow.com', 'Admin@123456')">
        <strong>Administrator</strong> (admin@docuflow.com)
      </button>
      <button class="demo-role-btn" onclick="fillCreds('manager@docuflow.com', 'Manager@123456')">
        <strong>Processing Manager</strong> (manager@docuflow.com)
      </button>
      <button class="demo-role-btn" onclick="fillCreds('viewer@docuflow.com', 'Viewer@123456')">
        <strong>Viewer</strong> (viewer@docuflow.com)
      </button>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/static/js/main.js"></script>
  <script>
    function fillCreds(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('loginError').style.display = 'none';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const submitBtn = document.getElementById('submitBtn');

      errorDiv.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok) {
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 400);
        } else {
          errorDiv.innerText = data.detail || 'Invalid email or password.';
          errorDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerText = 'Sign In';
        }
      } catch (err) {
        errorDiv.innerText = 'A network error occurred. Please try again.';
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
      }
    }
  </script>
</body>
</html>
